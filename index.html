<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일류 교사 도구 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: 가운데 카드 하나(시작·질문) → 결과는 상장+공유(왼쪽) / 추천 도구(오른쪽). 스티커처럼 둥근 테두리와 아래 그림자 */
:root{
  --bg:#EAF5EF;
  --surface:#FFFFFF;
  --ink:#24322B;
  --muted:#6B7B73;
  --line:#CFE2D7;
  --green:#2E7D5B;
  --green-soft:#DDF0E5;
  --yellow:#FFE27A;
  --pink:#FFC9CF;
  --sky:#BFE3FA;
  --lilac:#DCD3FF;
  --paper:#FFFDF6;
  --gold:#B08A3E;
  --seal:#D0362B;
  --warn-bg:#FFF1D6;
  --warn-ink:#7A4B00;
  --font-cute:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-cert:"Gowun Batang","Nanum Myeongjo","Batang",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13201A; --surface:#1B2A23; --ink:#E8F1EC; --muted:#A3B6AC; --line:#2F453A;
    --green:#80CDA8; --green-soft:#21392D; --yellow:#7A6420; --pink:#6E3C43; --sky:#2D5168; --lilac:#4A4170;
    --paper:#FFFDF6; --gold:#B08A3E; --seal:#D0362B; --warn-bg:#3A2D12; --warn-ink:#F2C979; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13201A; --surface:#1B2A23; --ink:#E8F1EC; --muted:#A3B6AC; --line:#2F453A;
  --green:#80CDA8; --green-soft:#21392D; --yellow:#7A6420; --pink:#6E3C43; --sky:#2D5168; --lilac:#4A4170;
  --paper:#FFFDF6; --gold:#B08A3E; --seal:#D0362B; --warn-bg:#3A2D12; --warn-ink:#F2C979; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:17px; line-height:1.6; word-break:keep-all;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px 40px;
}
.wrap{max-width:1160px; margin:0 auto}
button,input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--green); outline-offset:3px}
.sticker{background:var(--surface); border:2px solid var(--line); border-radius:24px; box-shadow:0 6px 0 var(--line)}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:translateY(10px) scale(.98)} to{transform:none}}

/* ---------- 시작 ---------- */
.intro{position:relative; max-width:760px; margin:6vh auto 0; padding:64px 32px 56px; text-align:center; overflow:hidden}
.intro .pill{display:inline-block; background:var(--yellow); color:var(--ink); font-family:var(--font-cute); font-size:16px; padding:5px 16px; border-radius:20px; margin-bottom:18px}
.intro h1{font-family:var(--font-cute); font-weight:400; font-size:clamp(40px,7vw,68px); line-height:1.18; margin:0 0 34px}
.intro h1 mark{background:linear-gradient(transparent 55%, var(--pink) 55%); color:inherit; padding:0 4px}
.btn-start{background:var(--green); color:var(--surface); border:0; border-radius:40px; padding:16px 44px;
  font-family:var(--font-cute); font-size:24px; cursor:pointer; box-shadow:0 5px 0 var(--ink); transition:transform .12s, box-shadow .12s}
.btn-start:hover{transform:translateY(-2px); box-shadow:0 7px 0 var(--ink)}
.btn-start:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
.deco{position:absolute; font-size:40px; line-height:1; pointer-events:none; animation:float 4s ease-in-out infinite}
.deco:nth-child(2n){animation-delay:-2s}
@keyframes float{50%{transform:translateY(-8px) rotate(6deg)}}

/* ---------- 질문 ---------- */
.quiz{max-width:860px; margin:2vh auto 0; padding:34px 36px 30px}
.qtop{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px}
.dots{display:flex; gap:8px}
.dots i{width:12px; height:12px; border-radius:50%; background:var(--line)}
.dots i.on{background:var(--green)}
.dots i.now{background:var(--yellow); outline:2px solid var(--green)}
.qbadge{font-family:var(--font-cute); font-size:18px; background:var(--green-soft); color:var(--green); padding:3px 14px; border-radius:20px}
.quiz h2{font-family:var(--font-cute); font-weight:400; font-size:clamp(26px,3.4vw,36px); line-height:1.35; margin:0 0 26px; text-wrap:balance}
.options{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px}
.options.n3{grid-template-columns:repeat(3, minmax(0,1fr))}
.opt{display:flex; flex-direction:column; align-items:flex-start; gap:10px; text-align:left;
  background:var(--surface); border:2px solid var(--line); border-radius:20px; box-shadow:0 5px 0 var(--line);
  padding:18px 20px 20px; cursor:pointer; transition:transform .12s, box-shadow .12s, border-color .12s; min-width:0}
.opt:hover{transform:translateY(-3px); border-color:var(--green); box-shadow:0 8px 0 var(--green-soft)}
.opt.picked{border-color:var(--green); background:var(--green-soft); transform:translateY(3px); box-shadow:0 2px 0 var(--green)}
.opt .emo{width:54px; height:54px; border-radius:16px; display:grid; place-items:center; font-size:30px}
.opt:nth-child(4n+1) .emo{background:var(--yellow)}
.opt:nth-child(4n+2) .emo{background:var(--sky)}
.opt:nth-child(4n+3) .emo{background:var(--pink)}
.opt:nth-child(4n+4) .emo{background:var(--lilac)}
.opt b{font-family:var(--font-cute); font-weight:400; font-size:20px; line-height:1.35}
.opt small{font-size:15px; color:var(--muted); margin-top:-6px}
.back{margin-top:20px; background:none; border:0; color:var(--muted); cursor:pointer; padding:4px 0; font-size:15px; text-decoration:underline; text-underline-offset:3px}

/* ---------- 결과 ---------- */
.result{display:grid; grid-template-columns:5fr 7fr; gap:26px; align-items:start}
.left{display:flex; flex-direction:column; gap:18px; min-width:0}
.cert{background:var(--paper); color:#2A2A22; border:1px solid var(--gold); border-radius:4px; padding:12px}
.cert-inner{border:3px double var(--gold); padding:26px 26px 34px; font-family:var(--font-cert); text-align:center}
.cert .no{text-align:left; font-size:12px; color:#7C7666; letter-spacing:.04em}
.cert .title{font-size:36px; font-weight:700; letter-spacing:.6em; padding-left:.6em; margin:8px 0 0}
.cert .award{text-align:right; font-size:15px; color:var(--gold); letter-spacing:.08em; margin:4px 0 20px}
.cert .name{font-size:18px; margin:0 0 6px}
.cert .name b{display:inline-block; min-width:5.5em; border-bottom:1px solid #9C9381; padding:0 6px; font-size:21px}
.cert .typename{font-size:16px; color:#5E5A4C; margin:0 0 18px}
.cert .typename b{color:#1F5C43; font-size:22px}
.cert .story{font-size:17px; line-height:1.95; margin:0 0 30px}
.cert .story strong{color:var(--seal)}
.signrow{position:relative; display:inline-block; margin-right:70px; font-size:17px; font-weight:700; letter-spacing:.06em; padding:14px 0}
.seal{position:absolute; left:100%; top:50%; margin:-54px 0 0 -18px; transform:rotate(-4deg);
  width:108px; height:108px; border:4px solid var(--seal); border-radius:6px; color:var(--seal);
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-cert); font-weight:700; line-height:1.25; opacity:.9;
  animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .3s backwards}
.seal::after{content:""; position:absolute; inset:4px; border:1px solid var(--seal); border-radius:3px}
.seal span{display:block; font-size:18px}
.seal span.s{font-size:16px; letter-spacing:0}
@keyframes stamp{from{transform:rotate(-4deg) scale(1.9)} to{transform:rotate(-4deg) scale(1)}}

.share{padding:18px 20px}
.share h4{font-family:var(--font-cute); font-weight:400; font-size:20px; margin:0 0 10px}
.share .row{display:flex; gap:10px; flex-wrap:wrap}
.share input{flex:1 1 160px; min-width:0; border:2px solid var(--line); border-radius:14px; padding:11px 14px; background:var(--surface)}
.btn-share{background:var(--seal); color:#fff; border:0; border-radius:14px; padding:11px 18px; font-family:var(--font-cute); font-size:18px; cursor:pointer; box-shadow:0 4px 0 #8E2119}
.btn-share:active{transform:translateY(3px); box-shadow:0 1px 0 #8E2119}
.btn-share[disabled]{opacity:.6; cursor:wait}
.share .msg{font-size:15px; margin:10px 0 0; color:var(--green)}
.share .msg.err{color:var(--warn-ink)}
.share a{color:var(--green); font-weight:700}

.tool{padding:26px 28px 22px; min-width:0}
.tool .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.label{font-size:14px; color:var(--muted)}
.chip{font-size:13px; padding:3px 11px; border-radius:20px; background:var(--green-soft); color:var(--green); font-weight:700; white-space:nowrap}
.chip.warn{background:var(--warn-bg); color:var(--warn-ink)}
.tname{display:flex; align-items:center; gap:14px; margin:8px 0 12px}
.tname .emo{width:62px; height:62px; border-radius:18px; background:var(--yellow); display:grid; place-items:center; font-size:34px; flex:none}
.tname h3{font-family:var(--font-cute); font-weight:400; font-size:40px; margin:0; line-height:1.15}
.ask{font-size:18px; line-height:1.75; margin:0 0 20px; background:var(--green-soft); border-radius:16px; padding:14px 18px}
.ask q{quotes:none; font-weight:700; color:var(--green)}
.tool h4{font-family:var(--font-cute); font-weight:400; font-size:20px; margin:0 0 10px}
.pick{background:var(--green-soft); border-radius:18px; padding:16px 18px; margin:0 0 18px}
.pick .tag{display:inline-block; font-size:13px; background:var(--green); color:var(--surface); padding:2px 10px; border-radius:20px; margin-bottom:6px}
.pick b{display:block; font-family:var(--font-cute); font-weight:400; font-size:23px; line-height:1.3}
.pick p{margin:4px 0 12px; font-size:17px}
.pick .now{border-top:2px dashed var(--green); padding-top:10px; font-size:16px}
.pick .now span{font-family:var(--font-cute); color:var(--green); margin-right:8px}
.more-h{font-size:15px; color:var(--muted); margin:0 0 4px}
.more{list-style:none; margin:0 0 14px; padding:0}
.more li{padding:7px 0; border-bottom:1px solid var(--line); font-size:15px; color:var(--muted)}
.more li:last-child{border-bottom:0}
.more li b{color:var(--ink); margin-right:8px}
.caution{font-size:15px; color:var(--warn-ink); margin:0 0 18px}
.caution b{background:var(--warn-bg); padding:1px 9px; border-radius:10px; margin-right:6px}
.links{display:flex; gap:10px; flex-wrap:wrap}
.links a{text-decoration:none; padding:11px 18px; border-radius:14px; font-family:var(--font-cute); font-size:17px}
.links a.primary{background:var(--green); color:var(--surface); box-shadow:0 4px 0 var(--ink)}
.links a.ghost{border:2px solid var(--line); color:var(--ink); background:var(--surface)}
.also{margin:18px 0 0; padding-top:12px; border-top:2px dashed var(--line); font-size:15px; color:var(--muted)}
.also a{color:var(--green); font-weight:700}

@media (max-width: 900px){
  .result{grid-template-columns:1fr}
  .options,.options.n3{grid-template-columns:1fr}
  .seal{width:88px; height:88px; margin-top:-44px}
  .seal span{font-size:15px} .seal span.s{font-size:13px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>

function stepQuestion(i){
  if (i===0) return Q1;
  if (i===1) return Q2[picks[0].opt.go];
  if (i===2) return Q3[picks[1].opt.go];
  return Q4;
}
function toolKey(){
  const o3 = picks[2] && picks[2].opt;
  return (o3 && o3.tool) ? o3.tool : picks[1].opt.go;
}

function renderIntro(){
  picks = [];
  const deco = [["📚","8%","14%"],["✏️","84%","10%"],["🎨","6%","70%"],["🎯","88%","66%"],["⭐","20%","88%"],["💬","74%","86%"],["🏫","4%","40%"]];
  app.innerHTML = `
  <section class="intro sticker pop">
    ${deco.map(([e,l,t])=>`<span class="deco" aria-hidden="true" style="left:${l};top:${t}">${e}</span>`).join("")}
    <span class="pill">교사용 심리테스트</span>
    <h1>나에게 딱 맞는<br><mark>도구</mark>는 뭘까?</h1>
    <button class="btn-start" id="start">시작하기 →</button>
  </section>`;
  document.getElementById("start").onclick = () => renderQ(0);
}

function renderQ(i){
  picks = picks.slice(0,i);
  const Q = stepQuestion(i);
  app.innerHTML = `
  <section class="quiz sticker pop">
    <div class="qtop">
      <div class="dots" aria-label="${i+1}/4">${[0,1,2,3].map(k=>`<i class="${k<i?'on':k===i?'now':''}"></i>`).join("")}</div>
      <span class="qbadge">Q${i+1}</span>
    </div>
    <h2>${esc(Q.q)}</h2>
    <div class="options${Q.o.length===3?' n3':''}" role="group" aria-label="선택지">
      ${Q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="emo" aria-hidden="true">${o.e}</span><b>${esc(o.label)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:""}</button>`).join("")}
    </div>
    ${i>0 ? `<button class="back" id="back">이전 질문으로</button>` : ""}
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    b.classList.add("picked");
    picks[i] = {q:Q, opt:Q.o[+b.dataset.j]};
    setTimeout(() => i<3 ? renderQ(i+1) : renderResult(), 260);
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => renderQ(i-1);
  window.scrollTo({top:0});
}

function renderResult(){
  const [p1,p2,p3,p4] = picks.map(p=>p.opt);
  const tk = toolKey(), T = TOOLS[tk];
  const featKey = p3.feat || T.hit;
  const tryit = tk==="wai" ? `'${p3.trail}'${jong(p3.trail)?"을":"를"} 웍스AI에 맡겨 보기` : (T.tries && T.tries[featKey]) || T.tryit;
  const rest = Object.keys(T.feats).filter(k=>k!==featKey);
  const no = String(ALL.indexOf(tk)+1).padStart(2,"0");
  const A = TOOLS[T.also[0]];
  const need = p3.need || p3.label;

  const story = `위 선생님은 ${p1.praise} ${p2.praise} ${p3.praise} ${p4.praise} 바쁜 학기말에도 AIEP로 더 좋은 수업을 연구하는 선생님은 이미 <strong>일류</strong>이기에 이 상장을 드립니다.`;
  const ask = `선생님은 <q>${esc(p1.want)}</q>${jong(p1.want)?"을":"를"} 원하시죠? 그중에서도 <q>${esc(need)}</q>${jong(need)?"이":"가"} 필요하고, 결국 바라는 건 <q>${esc(p4.want)}</q>${jong(p4.want)?"이죠":"죠"}. 그래서 이 도구를 골랐어요.`;

  app.innerHTML = `
  <section class="result pop">
    <div class="left">
      <article class="cert" id="cert" aria-label="상장">
        <div class="cert-inner">
          <div class="no">제 2026-AIEP-${no}호</div>
          <div class="title">상장</div>
          <div class="award">학기말 일류 교사상</div>
          <p class="name">성명 <b id="certName">&nbsp;</b> 선생님</p>
          <p class="typename">유형 · <b>${esc(T.type)}</b></p>
          <p class="story">${story}</p>
          <div class="signrow">2026 대전미래교육박람회
            <div class="seal" aria-hidden="true"><span>최고의</span><span>교사로</span><span class="s">인정합니다</span></div>
          </div>
        </div>
      </article>

      <div class="share sticker">
        <h4>📤 결과 공유하기</h4>
        <div class="row">
          <input id="nm" type="text" maxlength="12" placeholder="이름을 쓰면 상장에 들어가요" autocomplete="off">
          <button class="btn-share" id="shareBtn">복사하고 패들렛 열기</button>
        </div>
        <p class="msg" id="shareMsg" hidden></p>
      </div>
    </div>

    <article class="tool sticker">
      <div class="row">
        <span class="label">선생님 맞춤 추천 도구</span>
        <span class="chip">패들렛 ${T.sec}</span>
        ${T.student?'<span class="chip warn">학생계정 필요</span>':''}
      </div>
      <div class="tname"><span class="emo" aria-hidden="true">${T.emo}</span><h3>${T.name}</h3></div>
      <p class="ask">${ask}</p>
      <h4>${eul(T.name)} 이렇게 써 보세요</h4>
      <div class="pick">
        <span class="tag">선생님께 딱 맞는 기능</span>
        <b>${esc(T.feats[featKey][0])}</b>
        <p>${esc(T.feats[featKey][1])}</p>
        <div class="now"><span>지금 부스에서 해 보기</span>${esc(tryit)}</div>
      </div>
      <p class="more-h">이런 기능도 있어요</p>
      <ul class="more">${rest.map(k=>`<li><b>${esc(T.feats[k][0])}</b>${esc(T.feats[k][1])}</li>`).join("")}</ul>
      ${T.note?`<p class="caution"><b>유의</b>${esc(T.note)}</p>`:""}
      <div class="links">
        <a class="primary" href="${AIEP}" target="_blank" rel="noopener">AIEP 열기</a>
        <a class="ghost" href="${postUrl(T.id)}" target="_blank" rel="noopener">패들렛에서 ${esc(T.name)} 보기</a>
      </div>
      <p class="also">함께 보면 좋은 도구 · <a href="${postUrl(A.id)}" target="_blank" rel="noopener">${esc(A.name)}</a> — ${esc(T.also[1])}${A.student?' (학생계정 필요)':''}</p>
    </article>
  </section>`;

  const nm = document.getElementById("nm");
  const certName = document.getElementById("certName");
  nm.addEventListener("input", () => { certName.textContent = nm.value.trim() || " "; });
  document.getElementById("shareBtn").onclick = () => share(nm.value.trim());
  window.scrollTo({top:0});
}

/* ---------- 공유: 상장 이미지를 클립보드에 복사 → 패들렛 제출 링크 열기 ---------- */
function certBlob(){
  if (!window.html2canvas) return Promise.reject(new Error("no html2canvas"));
  const node = document.querySelector(".result");
  const bg = getComputedStyle(document.body).backgroundColor;
  return document.fonts.ready
    .then(() => html2canvas(node, {scale:2, backgroundColor:bg, windowWidth:1400, onclone: doc => { const st = doc.createElement("style"); st.textContent = "*{animation:none !important; transition:none !important} .result{width:1160px !important; grid-template-columns:5fr 7fr !important; padding:28px} .share,.links{display:none !important}"; doc.head.appendChild(st); }}))
    .then(c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/png")));
}
function say(text, err){
  const m = document.getElementById("shareMsg");
  m.hidden = false; m.className = "msg" + (err ? " err" : ""); m.innerHTML = text;
}
async function share(name){
  const btn = document.getElementById("shareBtn");
  btn.disabled = true; btn.textContent = "만드는 중…";
  const link = `<a href="${SUBMIT}" target="_blank" rel="noopener">패들렛 열기</a>`;
  let copied = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({"image/png": certBlob()})]);
      copied = true;
    }
  } catch (e) { copied = false; }

  if (copied) {
    say(`결과를 이미지로 복사했어요! 열린 패들렛에서 <b>Ctrl+V</b>로 붙여 넣고 이름을 적어 올려 주세요. 창이 안 열렸다면 ${link}`);
  } else {
    try {
      const blob = await certBlob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `일류교사테스트_${name || "선생님"}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      say(`결과 이미지를 내려받았어요. 패들렛에서 이 파일을 첨부해 올려 주세요. ${link}`);
    } catch (e) {
      say(`상장 이미지를 만들지 못했어요. 화면을 캡처해서 올려 주세요. ${link}`, true);
    }
  }
  window.open(SUBMIT, "_blank", "noopener");
  btn.disabled = false; btn.textContent = "다시 복사하기";
}

renderIntro();
</script>
</body>
</html>
